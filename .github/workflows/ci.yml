name: CI

on:
  push:
    branches: [main, draft]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Build
        env:
          VITE_API_URL: https://api.vocation.test
        run: npm run build

  e2e-journey:
    name: End-to-End Journey Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Journey Tests
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          GATEWAY_CALLBACK_TOKEN: ${{ secrets.GATEWAY_CALLBACK_TOKEN || 'test-callback-token' }}
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
