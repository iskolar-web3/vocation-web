        '500':
          $ref: '#/components/responses/InternalError'
  /admin/payouts:
    get:
      tags: [Admin]
      summary: Weekly coach payout list (API-078)
      operationId: API-078
      description: |
        Admin role. Coaches owed money now: ledger credits of sessions finished 7+ days ago with no
        dispute, minus clawbacks and payouts. Coaches owed nothing are omitted (ADR-0034).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owed payouts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OwedPayout'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin]
      summary: Record a manual coach payout (API-079)
      operationId: API-079
      description: |
        Admin role. `amount_centavos` must equal the amount the server computes the coach is owed
        now, else `409` with `details.owed_centavos`. Idempotent per `(coach, reference)`: a repeat
        returns `200` with `replayed: true`; the same reference with another amount is `409`
        (ADR-0034).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPayoutRequest'
      responses:
        '200':
          description: The reference was already recorded; nothing new was written.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ManualPayout'
        '201':
          description: Payout recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ManualPayout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/bookings/{id}/clawback:
    post:
      tags: [Admin]
      summary: Claw a booking back from its coach (API-081)
      operationId: API-081
      description: |
        Admin role. For a refund or lost chargeback that was the coach's fault. Debits what is still
        credited for the booking; repeating it is a no-op (ADR-0034).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClawBackRequest'
      responses:
        '200':
          description: Clawback recorded, or nothing to claw back.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          booking_id:
                            type: string
                            format: uuid
                          reason:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Presign an upload (API-080)
      operationId: API-080
      description: |
        Session (any role). Returns an S3 POST policy: the client uploads with a
        `multipart/form-data` POST to `url`, sending every entry of `fields` as a form field
        (in any order) and the file as the **last** part named `file`. The policy pins the
        exact `key` and `Content-Type` and a `content-length-range` of 1 byte to the
        per-purpose cap, so storage itself rejects an empty, oversized or retyped upload.
        Resumes land in a private prefix. `413` over the per-purpose size cap, `415` for a
        disallowed content type, `503` when object storage is not configured.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned upload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PresignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /webhooks/paymongo:
    post:
      tags: [Payments]
      summary: PayMongo webhook — the only thing that confirms a payment (API-045)
      operationId: API-045
      description: |
        **No session.** Verify the required `Paymongo-Signature` header against the exact raw body
        before parsing or applying the event. Only this verified webhook confirms a paid booking.
        PayMongo delivers checkout, payment failure, refund, and dispute events here.

        The order is the contract: verify signature → parse event → insert idempotently by `data.id`
        → resolve/transition → answer `200` after durable storage. Invalid signature is `401`, an
        unreadable body is `400`, and a storage failure is `500`.
      security: []
      parameters:
        - name: Paymongo-Signature
          in: header
          required: true
          schema:
            type: string
          description: PayMongo HMAC signature over the timestamp and exact raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayMongoEvent'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      tags: [Platform]
      summary: Health check (process and database)
      operationId: healthz
      description: |
        Pings the database with a 2-second timeout (ADR-0032). Note: unlike every other endpoint
        the `200` response is **not** wrapped in the ADR-0018 envelope; it is a bare
        `{ "message": "ok" }`. The `503` is a normal error envelope with code `unavailable`.
      security: []
      responses:
        '200':
          description: Process is up and the database answered.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '503':
          description: The database did not answer the ping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vocation_session
      description: |
        Server-side session cookie (`vocation_session`), `HttpOnly`, `Secure`, `SameSite=Lax`
        (ADR-0023). The only session scheme; there are no bearer tokens.
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    InternshipIDParam:
      name: internshipId
      in: path
      required: true
      schema:
        type: string
    SessionTypeIDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    WhenParam:
      name: when
      in: query
      schema:
        type: string
        enum: [upcoming, past]
        default: upcoming
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    EmptySuccess:
      description: Success with no payload (`data` is `null`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccess'
    BadRequest:
      description: Malformed JSON or missing required field (`bad_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: No or expired session, or a bad webhook token (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but the wrong role (`forbidden`), or a write whose `Origin` is not `WEB_ORIGIN` (`forbidden_origin`, ADR-0037).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Unknown record, an owner-scoped record the caller does not own, or a non-open posting (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Slot taken, already reviewed, already registered, or already in a final state (`conflict`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Valid JSON, invalid values — bad enum, slot outside availability, invalid field (`unprocessable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: Upload over the per-purpose size cap (`too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: |
        `unsupported_media_type` — a disallowed upload content type, or a write
        (`POST`/`PUT`/`PATCH` with a body) whose `Content-Type` is not `application/json`.
        The PayMongo webhook is exempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamFailed:
      description: PayMongo or Google unreachable (`upstream_failed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Maintenance or an unconfigured dependency (`unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure (`internal_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Envelope:
      type: object
      description: ADR-0018 response envelope. `message` is always present and safe to display.
      required: [message]
      properties:
        message:
          type: string
        data:
          description: Payload; `null` on error, `[]` for an empty list.
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          $ref: '#/components/schemas/Error'
    EmptySuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              nullable: true
    ErrorResponse:
      type: object
      required: [message, data, error]
      properties:
        message:
          type: string
          description: Top-level, always safe to display (ADR-0018).
        data:
          nullable: true
          description: Always `null` on error (ADR-0018 envelope).
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable machine value.
          enum:
            - bad_request
            - unauthenticated
            - forbidden
            - forbidden_origin
            - not_found
            - conflict
            - too_large
            - unsupported_media_type
            - unprocessable
            - rate_limited
            - upstream_failed
            - unavailable
            - internal_error
        details:
          type: object
          additionalProperties: true
          description: Field-level details for form errors.
    Meta:
      type: object
      description: Pagination, present on list responses only, plus an optional endpoint-specific balance.
      required: [page, per_page, total]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        balance:
          $ref: '#/components/schemas/Balance'
    EarningsMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          description: "`GET /me/earnings` always supplies a balance block (ADR-0028)."
          required: [balance]
          properties:
            balance:
              $ref: '#/components/schemas/Balance'
    Balance:
      type: object
      description: Coach earnings gauges on `GET /me/earnings` (ADR-0028).
      required: [available_centavos, in_transit_centavos, paid_out_centavos, pending_centavos]
      properties:
        available_centavos:
          type: integer
          format: int64
        in_transit_centavos:
          type: integer
          format: int64
        paid_out_centavos:
          type: integer
          format: int64
        pending_centavos:
          type: integer
          format: int64
    Role:
      type: string
      enum: [student, employer, coach, admin]
    SignupRole:
      type: string
      description: Signup roles — `admin` is never accepted (API-020).
      enum: [student, employer, coach]
    AuthAccount:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    Me:
      type: object
      description: |
        API-026's current-account body. Signup and signin keep `AuthAccount`; only `GET /me`
        carries the onboarding flag and the profile stub (ADR-0030).
      required: [id, email, role, is_onboarded, email_verified]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        full_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        is_onboarded:
          type: boolean
        email_verified:
          type: boolean
          description: True once the account's email was verified (API-027).
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/SignupRole'
        full_name:
          type: string
          nullable: true
          maxLength: 120
    SigninRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    GoogleSigninRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
        role:
          $ref: '#/components/schemas/SignupRole'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      description: |
        `email` is optional to the handler; `{}` still returns 202 (API-024) so the endpoint
        cannot be used to probe whether an address is registered.
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    WorkSetup:
