        is_paid:
          type: boolean
        work_setup:
          $ref: '#/components/schemas/WorkSetup'
        field:
          type: string
        deadline:
          type: string
          nullable: true
          description: Calendar date (`YYYY-MM-DD`) or null.
    InternshipDetail:
      type: object
      required:
        - id
        - slug
        - title
        - company
        - location
        - work_setup
        - is_paid
        - compensation_details
        - duration_weeks
        - deadline
        - field
        - description
        - requirements
        - perks
        - external_apply_url
      properties:
        id:
          type: string
          format: uuid
          description: "Opaque id; the key for apply-click (API-003) and save/unsave (API-035/036)."
        slug:
          type: string
        title:
          type: string
        company:
          $ref: '#/components/schemas/CompanySummary'
        location:
          type: string
        work_setup:
          $ref: '#/components/schemas/WorkSetup'
        is_paid:
          type: boolean
        compensation_details:
          type: string
          nullable: true
        duration_weeks:
          type: integer
          nullable: true
        deadline:
          type: string
          nullable: true
        field:
          type: string
        description:
          type: string
        requirements:
          type: string
        perks:
          type: string
          nullable: true
        external_apply_url:
          type: string
          format: uri
    CompanyCard:
      type: object
      required: [slug, name, logo_url, industry, location, verification_status, open_role_count]
      properties:
        slug:
          type: string
        name:
          type: string
        logo_url:
          type: string
          nullable: true
        industry:
          type: string
        location:
          type: string
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        open_role_count:
          type: integer
    CompanyProfile:
      type: object
      required:
        - slug
        - name
        - logo_url
        - industry
