      tags: [Bookings]
      summary: Resume payment (API-042)
      operationId: API-042
      description: |
        Student owner. Expires the previously stored Checkout Session before creating a replacement for a still-pending booking under the booking
        row lock. A payment already pending or processing returns `409 payment in progress`. Owner miss is `404`.
