    XenditCallback:
      anyOf:
        - $ref: '#/components/schemas/XenditInvoiceCallback'
        - $ref: '#/components/schemas/XenditRefundCallback'
        - $ref: '#/components/schemas/XenditPayoutCallback'
      description: |
        Xendit delivers invoice, refund and payout callbacks to the same URL; the server routes by
        body shape. The schemas below are permissive — they document the fields the server reads,
        not an exhaustive gateway contract.
    XenditInvoiceCallback:
      type: object
      additionalProperties: true
      required: [id, status]
      properties:
        id:
          type: string
          description: The Xendit invoice id; correlates to `booking.gateway_ref`.
        external_id:
          type: string
          description: The booking id the server set as the invoice's external id.
        status:
          type: string
          description: '`PAID` confirms; `EXPIRED` expires; anything else is recorded with no transition.'
        amount:
          type: number
        paid_amount:
          type: number
        paid_at:
          type: string
          format: date-time
        payment_method:
          type: string
        payment_channel:
          type: string
    XenditRefundCallback:
      type: object
      additionalProperties: true
      required: [event, data]
      properties:
        event:
          type: string
          enum: [refund.succeeded, refund.failed]
        data:
          type: object
          additionalProperties: true
          required: [invoice_id]
          properties:
            id:
              type: string
            invoice_id:
              type: string
              description: The invoice being refunded; correlates to `booking.gateway_ref`.
            reference_id:
              type: string
            status:
              type: string
    XenditPayoutCallback:
      type: object
      additionalProperties: true
      properties:
        event:
          type: string
          description: '`payout.succeeded|failed|expired|reversed` (or `v3_payout.*`).'
        id:
          type: string
          description: The Xendit payout id; correlates to `payout_batch.gateway_ref`.
        reference_id:
          type: string
          description: The payout batch id the runner sent.
        status:
          type: string
        failure_code:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Enveloped form nests the payout object here.
