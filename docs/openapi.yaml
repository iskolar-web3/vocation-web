      description: |
        **No session.** Authenticated solely by the `x-callback-token` header, compared in
        constant time before the body is read. An unconfigured token rejects every delivery.
        Xendit delivers invoice, refund and payout callbacks to this same URL, distinguished by
        body shape (ADR-0027, ADR-0028).

        The order is the contract: verify token → insert the event idempotently into
        `payment_event` → resolve/transition → always `200` once durably stored. A rejected or
        unmatched event is stored with `applied_at` null, alerts, and still answers `200` so
        Xendit does not retry forever and the payload is not lost. Only a token failure (`401`),
        an unreadable body (`400`) or a real storage failure (`500`) deviate.
      security: []
      parameters:
        - name: x-callback-token
          in: header
          required: true
          schema:
            type: string
          description: Static Xendit callback token; must equal `XENDIT_CALLBACK_TOKEN`.
        - name: webhook-id
          in: header
          required: false
          schema:
            type: string
          description: Per-delivery idempotency key (fallback is a deterministic event key).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XenditCallback'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      tags: [Platform]
      summary: Health check (process and database)
      operationId: healthz
      description: |
        Pings the database with a 2-second timeout (ADR-0032). Note: unlike every other endpoint
        the `200` response is **not** wrapped in the ADR-0018 envelope; it is a bare
        `{ "message": "ok" }`. The `503` is a normal error envelope with code `unavailable`.
      security: []
      responses:
        '200':
          description: Process is up and the database answered.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '503':
          description: The database did not answer the ping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vocation_session
      description: |
        Server-side session cookie (`vocation_session`), `HttpOnly`, `Secure`, `SameSite=Lax`
        (ADR-0023). The only session scheme; there are no bearer tokens.
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    InternshipIDParam:
      name: internshipId
      in: path
      required: true
      schema:
        type: string
    SessionTypeIDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    WhenParam:
      name: when
      in: query
      schema:
        type: string
        enum: [upcoming, past]
        default: upcoming
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    EmptySuccess:
      description: Success with no payload (`data` is `null`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccess'
    BadRequest:
      description: Malformed JSON or missing required field (`bad_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: No or expired session, or a bad webhook token (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but the wrong role (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Unknown record, an owner-scoped record the caller does not own, or a non-open posting (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Slot taken, already reviewed, already registered, or already in a final state (`conflict`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Valid JSON, invalid values — bad enum, slot outside availability, invalid field (`unprocessable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: Upload over the per-purpose size cap (`too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Disallowed upload content type (`unsupported_media_type`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamFailed:
      description: Xendit or Google unreachable (`upstream_failed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Maintenance or an unconfigured dependency (`unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure (`internal_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Envelope:
      type: object
      description: ADR-0018 response envelope. `message` is always present and safe to display.
      required: [message]
      properties:
        message:
          type: string
        data:
          description: Payload; `null` on error, `[]` for an empty list.
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          $ref: '#/components/schemas/Error'
    EmptySuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              nullable: true
    ErrorResponse:
      type: object
      required: [message, data, error]
      properties:
        message:
          type: string
          description: Top-level, always safe to display (ADR-0018).
        data:
          nullable: true
          description: Always `null` on error (ADR-0018 envelope).
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable machine value.
          enum:
            - bad_request
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - too_large
            - unsupported_media_type
            - unprocessable
            - rate_limited
            - upstream_failed
            - unavailable
            - internal_error
        details:
          type: object
          additionalProperties: true
          description: Field-level details for form errors.
    Meta:
      type: object
      description: Pagination, present on list responses only, plus an optional endpoint-specific balance.
      required: [page, per_page, total]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        balance:
          $ref: '#/components/schemas/Balance'
    EarningsMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          description: "`GET /me/earnings` always supplies a balance block (ADR-0028)."
          required: [balance]
          properties:
            balance:
              $ref: '#/components/schemas/Balance'
    Balance:
      type: object
      description: Coach earnings gauges on `GET /me/earnings` (ADR-0028).
      required: [available_centavos, in_transit_centavos, paid_out_centavos, pending_centavos]
      properties:
        available_centavos:
