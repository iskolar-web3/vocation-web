openapi: 3.0.3
info:
  title: iSkolar Vocation API
  version: 1.0.0
  description: |
    Machine-readable contract between vocation-server and vocation-web (api-spec.md Q1, ADR-0011).

    The canonical, machine-readable HTTP contract for the iSkolar Vocation server.

    This file describes **what the Go handlers actually ship**, not the intent prose in
    `docs/api-spec.md`. Where the two disagree, the code wins here and the disagreement is listed
    in the PR that produced this file. `api-spec.md` remains the narrative owner (auth intent,
    feature traceability, rationale); this file governs *types*.

    Conventions:
    - Paths are exactly as registered on the `http.ServeMux` in `cmd/api/main.go` and each
      module's `Register` method. The mux registers **no `/v1` prefix**; see `servers` below.
    - Every JSON response uses the ADR-0018 envelope `{ message, data, meta?, error? }`. `message`
      is always present and always safe to display. `data` is payload, `[]` for an empty list, or
      `null` on error. `meta` appears on list responses only.
    - All money is integer **centavos** (`*_centavos`), never floating point (AGENTS.md).
    - All timestamps are RFC 3339 UTC.
    - Operation ids are the permanent `API-###` ids from `api-spec.md`; where one id covers two
      operations (API-062, API-064, API-067) the id is suffixed to stay unique.
    - `POST /webhooks/xendit` is authenticated by the Xendit `x-callback-token` header, never a
      session, and answers `200` once an event is durably stored (ADR-0009, ADR-0027, ADR-0028).
servers:
  - url: /
    description: |
      Paths as the mux registers them. No `/v1` prefix is served today; the server mounts every
      route at the root and does not strip a prefix, and `api-spec.md` now records the same
      (API versioning is a future decision, not a current prefix).
  - url: https://api.vocation.iskolar.io
    description: Documented production host (hostname is an assumption in api-spec.md; no `/v1` prefix).
tags:
  - name: Auth
    description: iam — signup, signin, Google, password reset, session
  - name: Internships
    description: internships — public directory, detail, apply-click
  - name: Companies
    description: internships — public company directory
  - name: Coaches
    description: coaching — public coach directory, profile, reviews, availability
  - name: Landing
    description: landing — F-001 featured content
  - name: Student
    description: student — profile, saved internships, dashboard, settings
  - name: Bookings
    description: coaching — booking write path (F-011, F-022)
  - name: Coach
    description: coaching — coach self-service profile, session types, availability, earnings
  - name: Admin
    description: admin — company and internship lifecycle (F-050)
  - name: Uploads
    description: uploads — presigned uploads (F-023)
  - name: Payments
    description: payments — gateway webhooks
  - name: Platform
    description: cross-cutting liveness
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create an account (API-020)
      operationId: API-020
      description: |
        Public. `role` is student, employer or coach — **never `admin`**. On success a session
        cookie is set and the account is returned. Rate-limited 3/hour per IP (`429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Account created; session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/signin:
    post:
      tags: [Auth]
      summary: Sign in (API-021)
      operationId: API-021
      description: |
        Public. A wrong email and a wrong password both return the same generic `401` message.
        Rate-limited 5 per 15 minutes per IP **and** per email (`429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Signed in; session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google:
    post:
      tags: [Auth]
      summary: Google authorization-code sign-in (API-022)
      operationId: API-022
      description: |
        Public. `role` is required only for a first-time Google signup and is never `admin`.
        Returns `503 unavailable` when Google OAuth is not configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSigninRequest'
      responses:
        '200':
          description: Signed in; session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/signout:
    post:
      tags: [Auth]
      summary: Sign out (API-023)
      operationId: API-023
      description: Invalidates the server-side session and clears the cookie.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset (API-024)
      operationId: API-024
      description: |
        Public. **Always `202`**, whether or not the email exists, so it cannot be used to
        enumerate accounts. Rate-limited 5 per 15 minutes per IP and per email (`429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset (API-025)
      operationId: API-025
      description: Public. Consumes a single-use, expiring reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags: [Auth]
      summary: Current account (API-026)
      operationId: API-026
      description: Returns the signed-in account. Drives the auth-aware navbar.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /internships:
    get:
      tags: [Internships]
      summary: Search the internship directory (API-001)
      operationId: API-001
      description: |
        Public. Filters, sort and pagination. An empty page is `200` with `data: []` and
        `meta.total: 0` — never `404`. An unknown enum value is `422`. `sort=relevance` with no
        `q` falls back to `newest`.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free text over role, company, field, location and requirements.
        - name: field
          in: query
          schema:
            type: string
        - name: setup
          in: query
          schema:
            type: string
            enum: [remote, hybrid, onsite]
        - name: pay
          in: query
          schema:
            type: string
            enum: [any, paid, unpaid]
        - name: duration
          in: query
          schema:
            type: integer
            minimum: 0
          description: Maximum duration in weeks.
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, deadline_soon, relevance]
            default: newest
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A page of internship cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InternshipCard'
                      meta:
                        $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /internships/{slug}:
    get:
      tags: [Internships]
      summary: Internship detail (API-002)
      operationId: API-002
      description: Public. A non-`open` posting is `404`, identical to unknown (BR-003).
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: The internship detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/InternshipDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /internships/{id}/apply-click:
    post:
      tags: [Internships]
      summary: Record an outbound apply click (API-003)
      operationId: API-003
      description: |
        Public, and **never accepts an application payload** (BR-001, BR-002): strict decoding
        rejects any field other than `referrer_surface`. An optional session is recorded when
        present. Rate-limited 30/minute per IP (`429`).
      security:
        - sessionCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyClickRequest'
      responses:
        '202':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /companies:
    get:
      tags: [Companies]
      summary: Search companies (API-004)
      operationId: API-004
      description: Public. Ordered by name. Includes each company's open-role count.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A page of company cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CompanyCard'
                      meta:
                        $ref: '#/components/schemas/Meta'
        '500':
          $ref: '#/components/responses/InternalError'
  /companies/{slug}:
    get:
      tags: [Companies]
      summary: Company detail (API-005)
      operationId: API-005
      description: Public. Includes the company's `open` internships.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: The company profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanyProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /coaches:
    get:
      tags: [Coaches]
      summary: Search coaches (API-006)
      operationId: API-006
      description: Public. Filters on expertise and price. Unknown enum value is `422`.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: expertise
          in: query
          schema:
            type: string
        - name: price
          in: query
          schema:
            type: string
            enum: [any, free, paid]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A page of coach cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoachCard'
                      meta:
                        $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /coaches/{slug}:
    get:
      tags: [Coaches]
      summary: Coach profile (API-007)
      operationId: API-007
      description: Public. Profile, session types and rating aggregate.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: The public coach profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CoachProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /coaches/{slug}/reviews:
    get:
      tags: [Coaches]
      summary: Coach reviews (API-008)
      operationId: API-008
      description: |
        Public. An unknown coach is `404`, not an empty list. Reviewers are identified by first
        name only (BR-011).
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: The coach's reviews.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
                      meta:
                        $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /coaches/{slug}/availability:
    get:
      tags: [Coaches]
      summary: Public bookable availability (API-040)
      operationId: API-040
      description: |
        Public. `from` and `to` are required RFC 3339 timestamps. Only bookable (unbooked) slots
        are returned. An unknown coach is `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Bookable slots in the window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicAvailabilitySlot'
                      meta:
                        $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /landing:
    get:
      tags: [Landing]
      summary: Landing page content (API-011)
      operationId: API-011
      description: Public. Featured internships and coaches from live data, cached >= 60s.
      security: []
      responses:
        '200':
          description: Featured internships and coaches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LandingResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/student-profile:
    post:
      tags: [Student]
      summary: Complete student onboarding (API-030)
      operationId: API-030
      description: Student role. One-shot; a second call is `409`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentProfileRequest'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Student]
      summary: Edit the student profile (API-031)
      operationId: API-031
      description: Student role. Partial update; omitted fields are left unchanged. Skills replace wholesale.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/dashboard:
    get:
      tags: [Student]
      summary: Student dashboard (API-033)
      operationId: API-033
      description: Student role. Carries no application data (BR-014).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Dashboard counters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/saved:
    get:
      tags: [Student]
      summary: List saved internships (API-034)
      operationId: API-034
      description: Student role. Newest save first.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Saved internships.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SavedInternship'
                      meta:
                        $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/saved/{internshipId}:
    put:
      tags: [Student]
      summary: Save an internship (API-035)
      operationId: API-035
      description: Student role. Idempotent — a repeat save is `200`, not `409`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InternshipIDParam'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [internship_id]
                        properties:
                          internship_id:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Student]
      summary: Remove a saved internship (API-036)
      operationId: API-036
      description: Student role. Idempotent.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InternshipIDParam'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/settings:
    patch:
      tags: [Student]
      summary: Update account settings (API-038)
      operationId: API-038
      description: |
        Student role. `email`, `password` and `notification_preference` are independently
        optional and independently applied.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Applied settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /bookings:
    post:
      tags: [Bookings]
      summary: Create a booking (API-041)
      operationId: API-041
      description: |
        Student role. Free or intro-call sessions are written `confirmed`/`none` with no gateway
        call and no `checkout_url`. A paid session writes the booking first (`pending`/`pending`)
        with the stored money split (BR-007/BR-008, ADR-0007), then creates a Xendit invoice and
        returns `checkout_url`. Rate-limited 10/hour per account (`429`).
